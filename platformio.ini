; Statistical Library — PlatformIO configuration
; Native tests + AVR RAM analysis

[platformio]
default_envs = native

; ── Native unit tests (runs on host machine, no hardware needed) ──────────────
[env:native]
platform = native
test_framework = unity
build_flags =
    -I src
    -I test/mock
    -std=c++14
    -Wall

; ── Arduino Uno (ATmega328P, 2 KB RAM / 32 KB Flash) ────────────────────────
[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<../test/benchmark/*>
build_flags =
    -I src
    -Os
