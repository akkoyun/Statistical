sentence=Ultra-low-RAM statistics for Arduino: array stats, FILO sliding window, online stream, linear regression, vector addition.
paragraph=Header-only template library. Array_Stats computes sum/min/max/averages/quartile/IQR/stddev/variance on any numeric array. FILO_Stats provides a heap-free sliding window. Stream_Stats tracks min/max/mean online. Linear_Regression fits y=b1x+b0 with Slope/Offset/R2 and Compute_All(). Vector_Stats adds polar vectors.
